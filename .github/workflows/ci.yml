name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# One in-flight run per ref: a newer push to the same ref cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  # Failure alert (SUBC-013): every failing run (any event, any branch) opens or
  # comments on a `ci-failure` issue so the founder sees the failure without
  # watching the Actions tab. Deliberately NOT triggered by cancelled runs —
  # only failure() qualifies. Two simultaneous failing runs may race and create
  # two issues; later runs converge to comments on the open one.
  notify:
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Alert founder via ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          # No checkout in this job: every gh call targets the repo explicitly
          # (gh cannot infer it from a git remote without a working tree).
          gh label create ci-failure --color d73a4a --force -R "${REPO}"
          body="CI failed on ${REF} (event: ${EVENT})
          Commit: ${SHA}
          Run: ${RUN_URL}"
          issue=$(gh issue list --label ci-failure --state open --json number --jq '.[0].number' -R "${REPO}")
          if [ -n "${issue}" ]; then
            echo "Open ci-failure issue #${issue} exists — commenting instead of creating."
            gh issue comment "${issue}" --body "${body}" -R "${REPO}"
          else
            echo "No open ci-failure issue — creating one."
            gh issue create --title "CI failed on ${REF}" --label ci-failure --body "${body}" -R "${REPO}"
          fi
